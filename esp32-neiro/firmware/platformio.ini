; PlatformIO — сборка и прошивка ESP32 neiro (без Arduino IDE)
; Команды:
;   pio run              — собрать
;   pio run -t upload    — прошить (USB)
;   pio device monitor   — монитор порта 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  olikraus/U8g2 @ ^2.35.30
  marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_flags =
  -DCORE_DEBUG_LEVEL=1
