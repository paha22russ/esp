# nginx vhost for boiler public UI
# Install: /etc/nginx/sites-available/esp-boiler → sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name esp.pahavpn.cloud-ip.cc;

    # ACME for certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    root /var/www/esp-boiler;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# После certbot --nginx -d esp.pahavpn.cloud-ip.cc появится listen 443 ssl
