# nginx vhost for boiler public UI
# Install: /etc/nginx/sites-available/esp-boiler → sites-enabled

server {
    listen 80;
    listen [::]:80;
    server_name esp.pahavpn.cloud-ip.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name esp.pahavpn.cloud-ip.cc;

    ssl_certificate     /etc/letsencrypt/live/esp.pahavpn.cloud-ip.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/esp.pahavpn.cloud-ip.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/esp-boiler;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
